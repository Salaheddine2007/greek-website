<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>
  <!-- M3U file icon -->
  <rect x="280" y="80" width="240" height="200" rx="12" fill="#1E2838" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="280" y="80" width="240" height="40" rx="12" fill="#1A3050"/>
  <rect x="280" y="108" width="240" height="12" fill="#1A3050"/>
  <text x="400" y="107" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#4A9EE8">M3U</text>
  <!-- Code lines -->
  <rect x="298" y="138" width="180" height="8" rx="4" fill="#2A4060"/>
  <rect x="298" y="154" width="140" height="8" rx="4" fill="#8B5CF6" opacity="0.6"/>
  <rect x="298" y="170" width="160" height="8" rx="4" fill="#2A4060"/>
  <rect x="298" y="186" width="120" height="8" rx="4" fill="#4A9EE8" opacity="0.6"/>
  <rect x="298" y="202" width="150" height="8" rx="4" fill="#2A4060"/>
  <rect x="298" y="218" width="130" height="8" rx="4" fill="#3DCC8E" opacity="0.6"/>
  <rect x="298" y="234" width="170" height="8" rx="4" fill="#2A4060"/>
  <rect x="298" y="250" width="100" height="8" rx="4" fill="#4A9EE8" opacity="0.4"/>
  <!-- Greek flag colors hint -->
  <rect x="100" y="160" width="120" height="80" rx="8" fill="#1E2838" stroke="#4A9EE8" stroke-width="1"/>
  <rect x="100" y="160" width="120" height="11" fill="#4A9EE8"/>
  <rect x="100" y="182" width="120" height="11" fill="#fff" opacity="0.9"/>
  <rect x="100" y="204" width="120" height="11" fill="#4A9EE8"/>
  <rect x="100" y="226" width="120" height="14" fill="#fff" opacity="0.9"/>
  <!-- Play button -->
  <circle cx="160" cy="200" r="20" fill="#4A9EE8" opacity="0.2"/>
  <polygon points="153,192 153,208 171,200" fill="#4A9EE8"/>
  <!-- Right device -->
  <rect x="590" y="150" width="110" height="100" rx="8" fill="#1E2838" stroke="#8B5CF6" stroke-width="1"/>
  <rect x="600" y="160" width="90" height="60" rx="4" fill="#0F1319"/>
  <polygon points="630,175 630,205 660,190" fill="#8B5CF6" opacity="0.8"/>
  <rect x="630" y="225" width="30" height="8" rx="4" fill="#8B5CF6" opacity="0.4"/>
  <!-- Title -->
  <text x="400" y="360" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="26" font-weight="800" fill="#E4EEF8">IPTV M3U Greek</text>
  <text x="400" y="392" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="#8AAEC8">Ελληνικές Λίστες M3U για Streaming</text>
  <text x="400" y="420" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#506070">greekiptv.tv</text>
</svg>