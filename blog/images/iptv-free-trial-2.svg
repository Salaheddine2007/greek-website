<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="blue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <circle cx="700" cy="100" r="140" fill="#4A9EE8" opacity="0.04"/>
  <circle cx="80" cy="350" r="100" fill="#8B5CF6" opacity="0.06"/>
  <!-- Title -->
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#E4EEF8" text-anchor="middle">Εγκατάσταση IPTV Free Trial</text>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="14" fill="#8AAEC8" text-anchor="middle">Λειτουργεί σε κάθε συσκευή</text>
  <!-- Smart TV -->
  <rect x="60" y="110" width="160" height="110" rx="8" fill="#1E2838" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="70" y="120" width="140" height="80" rx="4" fill="#0D2A44"/>
  <rect x="110" y="220" width="60" height="8" rx="3" fill="#2A4060"/>
  <rect x="115" y="228" width="50" height="16" rx="3" fill="#2A4060"/>
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle">Smart TV</text>
  <text x="140" y="185" font-family="Arial, sans-serif" font-size="10" fill="#8AAEC8" text-anchor="middle">Samsung / LG</text>
  <!-- Android Phone -->
  <rect x="265" y="100" width="80" height="140" rx="10" fill="#1E2838" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="272" y="110" width="66" height="110" rx="5" fill="#0D2A44"/>
  <circle cx="305" cy="232" r="6" fill="#2A4060"/>
  <text x="305" y="150" font-family="Arial, sans-serif" font-size="10" fill="#4A9EE8" text-anchor="middle">Android</text>
  <text x="305" y="168" font-family="Arial, sans-serif" font-size="10" fill="#8AAEC8" text-anchor="middle">iOS</text>
  <!-- Firestick -->
  <rect x="380" y="130" width="120" height="70" rx="8" fill="#1E2838" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="390" y="140" width="100" height="50" rx="4" fill="#0D2A44"/>
  <rect x="425" y="200" width="30" height="20" rx="3" fill="#2A4060"/>
  <text x="440" y="168" font-family="Arial, sans-serif" font-size="10" fill="#4A9EE8" text-anchor="middle">Firestick</text>
  <text x="440" y="182" font-family="Arial, sans-serif" font-size="9" fill="#8AAEC8" text-anchor="middle">MAG Box</text>
  <!-- PC/Laptop -->
  <rect x="545" y="100" width="180" height="120" rx="8" fill="#1E2838" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="555" y="110" width="160" height="90" rx="4" fill="#0D2A44"/>
  <rect x="540" y="220" width="210" height="10" rx="5" fill="#2A4060"/>
  <text x="635" y="160" font-family="Arial, sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle">Windows / Mac</text>
  <text x="635" y="178" font-family="Arial, sans-serif" font-size="10" fill="#8AAEC8" text-anchor="middle">Browser / App</text>
  <!-- Steps -->
  <rect x="80" y="270" width="640" height="130" rx="12" fill="#141920" stroke="#1E3050" stroke-width="1"/>
  <text x="400" y="296" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E4EEF8" text-anchor="middle">Πώς να αποκτήσετε το IPTV Free Trial</text>
  <!-- Step 1 -->
  <circle cx="140" cy="345" r="18" fill="url(#blue2)"/>
  <text x="140" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <text x="140" y="375" font-family="Arial, sans-serif" font-size="11" fill="#8AAEC8" text-anchor="middle">Επισκεφθείτε</text>
  <text x="140" y="390" font-family="Arial, sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle">greekiptv.tv</text>
  <!-- Step 2 -->
  <circle cx="310" cy="345" r="18" fill="url(#blue2)"/>
  <text x="310" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">2</text>
  <text x="310" y="375" font-family="Arial, sans-serif" font-size="11" fill="#8AAEC8" text-anchor="middle">Επιλέξτε</text>
  <text x="310" y="390" font-family="Arial, sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle">Free Trial</text>
  <!-- Step 3 -->
  <circle cx="490" cy="345" r="18" fill="url(#blue2)"/>
  <text x="490" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <text x="490" y="375" font-family="Arial, sans-serif" font-size="11" fill="#8AAEC8" text-anchor="middle">Εγκαταστήστε &amp;</text>
  <text x="490" y="390" font-family="Arial, sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle">Απολαύστε</text>
  <!-- Step 4 -->
  <circle cx="660" cy="345" r="18" fill="url(#blue2)"/>
  <text x="660" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">4</text>
  <text x="660" y="375" font-family="Arial, sans-serif" font-size="11" fill="#8AAEC8" text-anchor="middle">Αναβαθμίστε</text>
  <text x="660" y="390" font-family="Arial, sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle">Συνδρομή</text>
  <!-- Arrows between steps -->
  <line x1="162" y1="345" x2="288" y2="345" stroke="#2A4060" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="332" y1="345" x2="468" y2="345" stroke="#2A4060" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="512" y1="345" x2="638" y2="345" stroke="#2A4060" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
