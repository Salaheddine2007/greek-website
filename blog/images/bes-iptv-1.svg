<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>
  <!-- Screen icon -->
  <rect x="260" y="100" width="280" height="175" rx="12" fill="#1E2838" stroke="#4A9EE8" stroke-width="2"/>
  <rect x="280" y="115" width="240" height="145" rx="6" fill="#141920"/>
  <!-- Play button -->
  <circle cx="400" cy="188" r="28" fill="url(#accent)" opacity="0.9"/>
  <polygon points="392,177 392,199 416,188" fill="white"/>
  <!-- Stand -->
  <rect x="380" y="275" width="40" height="15" rx="4" fill="#1E2838" stroke="#4A9EE8" stroke-width="1"/>
  <rect x="360" y="288" width="80" height="8" rx="4" fill="#1E2838" stroke="#4A9EE8" stroke-width="1"/>
  <!-- Signal waves -->
  <path d="M 460 155 Q 490 155 490 188 Q 490 221 460 221" stroke="#4A9EE8" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 468 165 Q 488 165 488 188 Q 488 211 468 211" stroke="#4A9EE8" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Text -->
  <text x="400" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#accent)">BES IPTV</text>
  <text x="400" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8AAEC8">Υπηρεσία Streaming IPTV</text>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#506070">greekiptv.tv</text>
  <!-- Dots decoration -->
  <circle cx="120" cy="80" r="3" fill="#4A9EE8" opacity="0.4"/>
  <circle cx="140" cy="60" r="2" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="100" cy="110" r="2" fill="#4A9EE8" opacity="0.3"/>
  <circle cx="680" cy="80" r="3" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="660" cy="60" r="2" fill="#4A9EE8" opacity="0.4"/>
  <circle cx="700" cy="110" r="2" fill="#8B5CF6" opacity="0.3"/>
</svg>