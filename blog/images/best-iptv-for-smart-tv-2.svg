<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#141920"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3DCC8E"/>
      <stop offset="100%" style="stop-color:#4A9EE8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Subtle grid -->
  <line x1="0" y1="90" x2="800" y2="90" stroke="#1E3050" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#1E3050" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="270" x2="800" y2="270" stroke="#1E3050" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#1E3050" stroke-width="1" opacity="0.4"/>
  <!-- Title -->
  <text x="400" y="45" font-family="Arial,sans-serif" font-size="20" fill="#E4EEF8" text-anchor="middle" font-weight="bold">Γιατί το greekiptv.tv είναι το #1 IPTV για Smart TV</text>
  <rect x="160" y="52" width="480" height="2" rx="1" fill="url(#bar1)" opacity="0.6"/>
  <!-- Feature comparison bars -->
  <!-- Row 1: Σταθερότητα -->
  <text x="50" y="105" font-family="Arial,sans-serif" font-size="13" fill="#8AAEC8">Σταθερότητα</text>
  <rect x="200" y="90" width="400" height="26" rx="5" fill="#1E2838"/>
  <rect x="200" y="90" width="396" height="26" rx="5" fill="url(#bar1)"/>
  <text x="610" y="108" font-family="Arial,sans-serif" font-size="12" fill="#3DCC8E" font-weight="bold">99.9%</text>
  <!-- Row 2: Κανάλια -->
  <text x="50" y="155" font-family="Arial,sans-serif" font-size="13" fill="#8AAEC8">Κανάλια</text>
  <rect x="200" y="140" width="400" height="26" rx="5" fill="#1E2838"/>
  <rect x="200" y="140" width="390" height="26" rx="5" fill="url(#bar1)" opacity="0.9"/>
  <text x="610" y="158" font-family="Arial,sans-serif" font-size="12" fill="#4A9EE8" font-weight="bold">30,000+</text>
  <!-- Row 3: Ποιότητα -->
  <text x="50" y="205" font-family="Arial,sans-serif" font-size="13" fill="#8AAEC8">Ποιότητα</text>
  <rect x="200" y="190" width="400" height="26" rx="5" fill="#1E2838"/>
  <rect x="200" y="190" width="380" height="26" rx="5" fill="url(#bar2)" opacity="0.85"/>
  <text x="610" y="208" font-family="Arial,sans-serif" font-size="12" fill="#3DCC8E" font-weight="bold">4K / FHD</text>
  <!-- Row 4: VOD -->
  <text x="50" y="255" font-family="Arial,sans-serif" font-size="13" fill="#8AAEC8">Ταινίες VOD</text>
  <rect x="200" y="240" width="400" height="26" rx="5" fill="#1E2838"/>
  <rect x="200" y="240" width="395" height="26" rx="5" fill="url(#bar1)" opacity="0.8"/>
  <text x="610" y="258" font-family="Arial,sans-serif" font-size="12" fill="#8B5CF6" font-weight="bold">150,000+</text>
  <!-- Row 5: Υποστήριξη -->
  <text x="50" y="305" font-family="Arial,sans-serif" font-size="13" fill="#8AAEC8">Υποστήριξη</text>
  <rect x="200" y="290" width="400" height="26" rx="5" fill="#1E2838"/>
  <rect x="200" y="290" width="388" height="26" rx="5" fill="url(#bar2)" opacity="0.9"/>
  <text x="610" y="308" font-family="Arial,sans-serif" font-size="12" fill="#4A9EE8" font-weight="bold">24/7</text>
  <!-- Compatible devices icons text -->
  <rect x="50" y="340" width="700" height="60" rx="8" fill="#1A2130" opacity="0.8"/>
  <text x="400" y="364" font-family="Arial,sans-serif" font-size="12" fill="#4A9EE8" text-anchor="middle" font-weight="bold">Συμβατό με όλες τις Smart TV</text>
  <text x="400" y="385" font-family="Arial,sans-serif" font-size="11" fill="#8AAEC8" text-anchor="middle">Samsung • LG • Sony • Philips • Android TV • Hisense • Panasonic</text>
  <!-- CTA -->
  <rect x="290" y="408" width="220" height="32" rx="16" fill="url(#bar1)"/>
  <text x="400" y="429" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">greekiptv.tv — Δοκίμασε Τώρα</text>
</svg>
