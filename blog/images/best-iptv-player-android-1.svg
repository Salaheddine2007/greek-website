<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Android device outline -->
  <rect x="290" y="60" width="220" height="330" rx="24" ry="24" fill="#1E2838" stroke="#4A9EE8" stroke-width="2"/>
  <rect x="310" y="90" width="180" height="270" rx="4" ry="4" fill="#0F1319"/>
  <!-- Screen content - channel list -->
  <rect x="315" y="95" width="170" height="260" rx="2" fill="#141920"/>
  <rect x="320" y="100" width="160" height="8" rx="2" fill="#4A9EE8" opacity="0.8"/>
  <rect x="320" y="115" width="130" height="6" rx="2" fill="#2A4060"/>
  <rect x="320" y="128" width="140" height="6" rx="2" fill="#2A4060"/>
  <rect x="320" y="141" width="120" height="6" rx="2" fill="#4A9EE8" opacity="0.5"/>
  <rect x="320" y="154" width="135" height="6" rx="2" fill="#2A4060"/>
  <rect x="320" y="167" width="145" height="6" rx="2" fill="#2A4060"/>
  <rect x="320" y="180" width="110" height="6" rx="2" fill="#8B5CF6" opacity="0.7"/>
  <!-- Home button -->
  <circle cx="400" cy="375" r="10" fill="none" stroke="#4A9EE8" stroke-width="1.5"/>
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="url(#accent)">Καλύτερος IPTV Player Android</text>
  <text x="400" y="52" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#8AAEC8">IPTV Smarters Pro · TiviMate · GSE Smart IPTV</text>
  <!-- Side label -->
  <text x="80" y="200" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="16" fill="#4A9EE8" font-weight="600">+30.000</text>
  <text x="80" y="220" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#8AAEC8">κανάλια</text>
  <text x="680" y="200" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="16" fill="#8B5CF6" font-weight="600">4K</text>
  <text x="680" y="220" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#8AAEC8">ποιότητα</text>
  <text x="400" y="430" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#506070">greekiptv.tv</text>
</svg>