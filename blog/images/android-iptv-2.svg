  <text x="80" y="313" font-family="Arial, sans-serif" font-size="11" fill="#aaa">• Advanced playlist manager</text>
  <text x="80" y="329" font-family="Arial, sans-serif" font-size="11" fill="#4A9EE8">✓ Δωρεάν με διαφημίσεις</text>
