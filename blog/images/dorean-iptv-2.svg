<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#grad2)"/>
  <!-- Channels grid -->
  <rect x="120" y="100" width="100" height="70" rx="8" fill="#1E2838" stroke="#4A9EE8" stroke-width="1.5" opacity="0.9"/>
  <rect x="240" y="100" width="100" height="70" rx="8" fill="#1E2838" stroke="#8B5CF6" stroke-width="1.5" opacity="0.9"/>
  <rect x="360" y="100" width="100" height="70" rx="8" fill="#1E2838" stroke="#4A9EE8" stroke-width="1.5" opacity="0.9"/>
  <rect x="480" y="100" width="100" height="70" rx="8" fill="#1E2838" stroke="#8B5CF6" stroke-width="1.5" opacity="0.9"/>
  <rect x="600" y="100" width="100" height="70" rx="8" fill="#1E2838" stroke="#4A9EE8" stroke-width="1.5" opacity="0.9"/>
  <!-- Channel labels -->
  <text x="170" y="142" font-family="Arial" font-size="13" text-anchor="middle" fill="#4A9EE8" font-weight="bold">ΑΝΤ1</text>
  <text x="290" y="142" font-family="Arial" font-size="13" text-anchor="middle" fill="#8B5CF6" font-weight="bold">ΣΚΑΪ</text>
  <text x="410" y="142" font-family="Arial" font-size="13" text-anchor="middle" fill="#4A9EE8" font-weight="bold">ΕΡΤ1</text>
  <text x="530" y="142" font-family="Arial" font-size="13" text-anchor="middle" fill="#8B5CF6" font-weight="bold">MEGA</text>
  <text x="650" y="142" font-family="Arial" font-size="13" text-anchor="middle" fill="#4A9EE8" font-weight="bold">ALPHA</text>
  <!-- Second row -->
  <rect x="160" y="195" width="100" height="70" rx="8" fill="#1E2838" stroke="#4A9EE8" stroke-width="1" opacity="0.7"/>
  <rect x="280" y="195" width="100" height="70" rx="8" fill="#1E2838" stroke="#8B5CF6" stroke-width="1" opacity="0.7"/>
  <rect x="400" y="195" width="100" height="70" rx="8" fill="#1E2838" stroke="#4A9EE8" stroke-width="1" opacity="0.7"/>
  <rect x="520" y="195" width="100" height="70" rx="8" fill="#1E2838" stroke="#8B5CF6" stroke-width="1" opacity="0.7"/>
  <text x="210" y="237" font-family="Arial" font-size="12" text-anchor="middle" fill="#8AAEC8">Star</text>
  <text x="330" y="237" font-family="Arial" font-size="12" text-anchor="middle" fill="#8AAEC8">Open TV</text>
  <text x="450" y="237" font-family="Arial" font-size="12" text-anchor="middle" fill="#8AAEC8">Sport TV</text>
  <text x="570" y="237" font-family="Arial" font-size="12" text-anchor="middle" fill="#8AAEC8">Ε1</text>
  <!-- Main text -->
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#grad2)">+30.000 Κανάλια</text>
  <text x="400" y="355" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#8AAEC8">Δωρεάν IPTV vs Συνδρομή</text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#506070">greekiptv.tv</text>
