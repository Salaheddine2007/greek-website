<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#141920"/>
    </linearGradient>
    <linearGradient id="blue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#1E3050" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1E3050" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#1E3050" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#1E3050" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#1E3050" stroke-width="1" opacity="0.4"/>
  <!-- Channel cards -->
  <!-- Card 1 -->
  <rect x="60" y="80" width="140" height="90" rx="10" fill="#1A2130" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="75" y="95" width="110" height="55" rx="5" fill="#0D1520"/>
  <text x="130" y="125" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#4A9EE8">BTV</text>
  <text x="130" y="142" text-anchor="middle" font-family="Arial" font-size="9" fill="#8AAEC8">Bulgaria</text>
  <!-- Card 2 -->
  <rect x="220" y="80" width="140" height="90" rx="10" fill="#1A2130" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="235" y="95" width="110" height="55" rx="5" fill="#0D1520"/>
  <text x="290" y="125" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#8B5CF6">NOVA</text>
  <text x="290" y="142" text-anchor="middle" font-family="Arial" font-size="9" fill="#8AAEC8">Sport</text>
  <!-- Card 3 -->
  <rect x="380" y="80" width="140" height="90" rx="10" fill="#1A2130" stroke="#4A9EE8" stroke-width="2"/>
  <rect x="395" y="95" width="110" height="55" rx="5" fill="#0D1520"/>
  <text x="450" y="120" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#4A9EE8">GREEK</text>
  <text x="450" y="135" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#8B5CF6">IPTV</text>
  <text x="450" y="152" text-anchor="middle" font-family="Arial" font-size="8" fill="#3DCC8E">✓ Προτεινόμενο</text>
  <!-- Card 4 -->
  <rect x="540" y="80" width="140" height="90" rx="10" fill="#1A2130" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="555" y="95" width="110" height="55" rx="5" fill="#0D1520"/>
  <text x="610" y="125" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#4A9EE8">HBO</text>
  <text x="610" y="142" text-anchor="middle" font-family="Arial" font-size="9" fill="#8AAEC8">Cinema</text>
  <!-- Connection lines -->
  <line x1="130" y1="170" x2="130" y2="200" stroke="#2A4060" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="290" y1="170" x2="290" y2="200" stroke="#2A4060" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="450" y1="170" x2="450" y2="200" stroke="#4A9EE8" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="610" y1="170" x2="610" y2="200" stroke="#2A4060" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Central hub -->
  <circle cx="400" cy="255" r="35" fill="#141920" stroke="url(#blue2)" stroke-width="2.5"/>
  <text x="400" y="251" text-anchor="middle" font-family="Arial" font-size="10" fill="#4A9EE8">30.000+</text>
  <text x="400" y="265" text-anchor="middle" font-family="Arial" font-size="9" fill="#8AAEC8">κανάλια</text>
  <!-- Hub connections -->
  <line x1="130" y1="200" x2="370" y2="245" stroke="#2A4060" stroke-width="1" opacity="0.6"/>
  <line x1="290" y1="200" x2="375" y2="245" stroke="#2A4060" stroke-width="1" opacity="0.6"/>
  <line x1="450" y1="200" x2="425" y2="225" stroke="#4A9EE8" stroke-width="1.5"/>
  <line x1="610" y1="200" x2="430" y2="245" stroke="#2A4060" stroke-width="1" opacity="0.6"/>
  <!-- Bottom devices -->
  <!-- Phone -->
  <rect x="100" y="320" width="60" height="100" rx="8" fill="#1A2130" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="108" y="330" width="44" height="78" rx="4" fill="#0D1520"/>
  <circle cx="130" cy="415" r="4" fill="#2A4060"/>
  <!-- TV -->
  <rect x="280" y="310" width="120" height="80" rx="8" fill="#1A2130" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="290" y="320" width="100" height="60" rx="4" fill="#0D1520"/>
  <rect x="325" y="390" width="30" height="10" rx="3" fill="#141920"/>
  <rect x="305" y="400" width="70" height="6" rx="3" fill="#0D1520"/>
  <!-- Laptop -->
  <rect x="480" y="320" width="120" height="75" rx="6" fill="#1A2130" stroke="#2A4060" stroke-width="1.5"/>
  <rect x="490" y="330" width="100" height="58" rx="4" fill="#0D1520"/>
  <rect x="460" y="395" width="160" height="10" rx="3" fill="#141920"/>
  <!-- Connection from hub to devices -->
  <line x1="370" y1="280" x2="130" y2="320" stroke="#2A4060" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <line x1="390" y1="285" x2="340" y2="310" stroke="#4A9EE8" stroke-width="1.5" opacity="0.5"/>
  <line x1="410" y1="285" x2="460" y2="320" stroke="#2A4060" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- Title -->
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#E4EEF8">Bulsatcom IPTV vs Greek IPTV</text>
  <text x="400" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8AAEC8">Σύγκριση Υπηρεσιών Streaming 2026</text>
</svg>
