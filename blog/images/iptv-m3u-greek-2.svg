<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#141920"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#4A9EE8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect x="0" y="446" width="800" height="4" fill="url(#accent2)"/>
  <!-- Devices grid showing IPTV M3U playback -->
  <!-- Smart TV -->
  <rect x="60" y="80" width="200" height="130" rx="8" fill="#1E2838" stroke="#4A9EE8" stroke-width="1.5"/>
  <rect x="70" y="90" width="180" height="100" rx="4" fill="#0D1520"/>
  <text x="160" y="148" text-anchor="middle" font-family="monospace" font-size="13" fill="#4A9EE8">▶ ERT1 HD</text>
  <rect x="140" y="210" width="40" height="14" rx="3" fill="#2A4060"/>
  <text x="60" y="244" font-family="'DM Sans', Arial" font-size="12" fill="#506070">Smart TV</text>
  <!-- Phone -->
  <rect x="310" y="70" width="80" height="140" rx="10" fill="#1E2838" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="318" y="82" width="64" height="104" rx="4" fill="#0D1520"/>
  <text x="350" y="138" text-anchor="middle" font-family="monospace" font-size="10" fill="#8B5CF6">▶ ANT1</text>
  <rect x="340" y="220" width="20" height="6" rx="3" fill="#2A4060"/>
  <text x="310" y="244" font-family="'DM Sans', Arial" font-size="12" fill="#506070">Android / iOS</text>
  <!-- PC Monitor -->
  <rect x="450" y="80" width="200" height="130" rx="6" fill="#1E2838" stroke="#3DCC8E" stroke-width="1.5"/>
  <rect x="460" y="90" width="180" height="100" rx="3" fill="#0D1520"/>
  <text x="550" y="148" text-anchor="middle" font-family="monospace" font-size="13" fill="#3DCC8E">▶ MEGA HD</text>
  <rect x="530" y="210" width="40" height="14" rx="3" fill="#2A4060"/>
  <rect x="560" y="224" width="2" height="20" fill="#2A4060"/>
  <rect x="520" y="244" width="82" height="8" rx="4" fill="#2A4060"/>
  <text x="450" y="265" font-family="'DM Sans', Arial" font-size="12" fill="#506070">PC / Mac (VLC, Kodi)</text>
  <!-- M3U URL bar in center -->
  <rect x="140" y="300" width="520" height="40" rx="8" fill="#1A2130" stroke="#2A4060" stroke-width="1"/>
  <text x="160" y="325" font-family="monospace" font-size="13" fill="#4A9EE8">m3u: </text>
  <text x="205" y="325" font-family="monospace" font-size="13" fill="#8AAEC8">https://greekiptv.tv/playlist.m3u</text>
  <!-- Title -->
  <text x="400" y="372" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#E4EEF8">Φόρτωση M3U σε Κάθε Συσκευή</text>
  <text x="400" y="400" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" fill="#8AAEC8">TiViMate · IPTV Smarters · VLC · Kodi</text>
  <text x="400" y="428" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#506070">greekiptv.tv</text>
</svg>