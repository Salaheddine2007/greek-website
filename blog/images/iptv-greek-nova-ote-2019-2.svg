<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Channel list cards -->
  <rect x="60" y="80" width="200" height="280" rx="12" fill="#1A2130" stroke="#1E3050" stroke-width="1"/>
  <rect x="75" y="100" width="170" height="50" rx="8" fill="#4A9EE8" opacity="0.15"/>
  <text x="160" y="130" font-family="Arial" font-size="16" font-weight="bold" fill="#4A9EE8" text-anchor="middle">Nova Sport</text>
  <rect x="75" y="162" width="170" height="50" rx="8" fill="#8B5CF6" opacity="0.15"/>
  <text x="160" y="192" font-family="Arial" font-size="16" font-weight="bold" fill="#8B5CF6" text-anchor="middle">OTE Cinema</text>
  <rect x="75" y="224" width="170" height="50" rx="8" fill="#3DCC8E" opacity="0.15"/>
  <text x="160" y="254" font-family="Arial" font-size="16" font-weight="bold" fill="#3DCC8E" text-anchor="middle">ERT World</text>
  <rect x="75" y="286" width="170" height="50" rx="8" fill="#4A9EE8" opacity="0.10"/>
  <text x="160" y="316" font-family="Arial" font-size="16" font-weight="bold" fill="#8AAEC8" text-anchor="middle">+30.000 κανάλια</text>
  <!-- Arrow -->
  <text x="305" y="235" font-family="Arial" font-size="40" fill="#4A9EE8" opacity="0.6">→</text>
  <!-- Right panel: device icons -->
  <rect x="360" y="80" width="380" height="280" rx="12" fill="#1A2130" stroke="#1E3050" stroke-width="1"/>
  <text x="550" y="115" font-family="Arial" font-size="14" fill="#8AAEC8" text-anchor="middle">Παρακολουθήστε σε κάθε συσκευή</text>
  <!-- Smart TV icon -->
  <rect x="390" y="135" width="100" height="65" rx="6" fill="#1E2838" stroke="#4A9EE8" stroke-width="1.5"/>
  <rect x="398" y="142" width="84" height="51" rx="3" fill="#141920"/>
  <rect x="432" y="200" width="20" height="10" rx="2" fill="#1E2838"/>
  <rect x="420" y="210" width="44" height="5" rx="2" fill="#1E2838"/>
  <text x="440" y="230" font-family="Arial" font-size="10" fill="#8AAEC8" text-anchor="middle">Smart TV</text>
  <!-- Phone icon -->
  <rect x="515" y="135" width="50" height="85" rx="8" fill="#1E2838" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="522" y="143" width="36" height="65" rx="3" fill="#141920"/>
  <circle cx="540" cy="214" r="4" fill="#8B5CF6" opacity="0.5"/>
  <text x="540" y="235" font-family="Arial" font-size="10" fill="#8AAEC8" text-anchor="middle">Mobile</text>
  <!-- Tablet icon -->
  <rect x="590" y="135" width="120" height="90" rx="8" fill="#1E2838" stroke="#3DCC8E" stroke-width="1.5"/>
  <rect x="598" y="143" width="104" height="70" rx="3" fill="#141920"/>
  <circle cx="650" cy="219" r="4" fill="#3DCC8E" opacity="0.5"/>
  <text x="650" y="237" font-family="Arial" font-size="10" fill="#8AAEC8" text-anchor="middle">Tablet</text>
  <!-- Streaming indicator -->
  <circle cx="550" cy="295" r="8" fill="#4A9EE8" opacity="0.3"/>
  <circle cx="550" cy="295" r="4" fill="#4A9EE8"/>
  <text x="550" y="315" font-family="Arial" font-size="11" fill="#4A9EE8" text-anchor="middle">LIVE Streaming</text>
  <!-- Bottom text -->
  <text x="400" y="395" font-family="Arial" font-size="19" font-weight="bold" fill="#E4EEF8" text-anchor="middle">Greek IPTV — Nova, OTE, Cosmote</text>
  <text x="400" y="420" font-family="Arial" font-size="13" fill="#8AAEC8" text-anchor="middle">greekiptv.tv — Η καλύτερη ελληνική IPTV υπηρεσία</text>
</svg>
