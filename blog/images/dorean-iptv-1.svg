<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>
  <!-- TV screen icon -->
  <rect x="280" y="100" width="240" height="160" rx="12" ry="12" fill="#1E2838" stroke="#4A9EE8" stroke-width="2"/>
  <rect x="295" y="115" width="210" height="130" rx="6" ry="6" fill="#141920"/>
  <!-- Play button -->
  <polygon points="370,155 370,215 430,185" fill="#4A9EE8" opacity="0.9"/>
  <!-- Stand -->
  <rect x="365" y="260" width="70" height="12" rx="4" fill="#1E2838" stroke="#2A4060" stroke-width="1"/>
  <rect x="340" y="272" width="120" height="8" rx="4" fill="#1E2838" stroke="#2A4060" stroke-width="1"/>
  <!-- Text -->
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="url(#accent)">Δωρεάν IPTV</text>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#8AAEC8">Ελληνική Τηλεόραση Online</text>
  <!-- Wifi signal dots -->
  <circle cx="640" cy="120" r="4" fill="#4A9EE8" opacity="0.6"/>
  <circle cx="660" cy="120" r="4" fill="#4A9EE8" opacity="0.4"/>
  <circle cx="680" cy="120" r="4" fill="#4A9EE8" opacity="0.2"/>
  <!-- Stars/sparkles -->
  <circle cx="150" cy="150" r="2" fill="#4A9EE8" opacity="0.5"/>
  <circle cx="170" cy="200" r="3" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="130" cy="280" r="2" fill="#4A9EE8" opacity="0.3"/>
  <circle cx="650" cy="300" r="2" fill="#8B5CF6" opacity="0.5"/>
  <circle cx="680" cy="200" r="3" fill="#4A9EE8" opacity="0.4"/>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#506070">greekiptv.tv</text>
</svg>