<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>
  <!-- TV screen icon -->
  <rect x="280" y="100" width="240" height="160" rx="12" fill="none" stroke="#4A9EE8" stroke-width="3"/>
  <rect x="300" y="115" width="200" height="130" rx="6" fill="#1A2130"/>
  <line x1="370" y1="260" x2="430" y2="260" stroke="#4A9EE8" stroke-width="2"/>
  <rect x="350" y="260" width="100" height="10" rx="5" fill="#1E3050"/>
  <!-- Play button -->
  <circle cx="400" cy="180" r="30" fill="none" stroke="#4A9EE8" stroke-width="2" opacity="0.8"/>
  <polygon points="390,165 390,195 420,180" fill="#4A9EE8" opacity="0.9"/>
  <!-- Signal waves -->
  <path d="M460 160 Q480 180 460 200" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M470 150 Q500 180 470 210" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M480 140 Q520 180 480 220" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Text -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">IPTV GE Rustavi 2</text>
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8AAEC8">Παρακολουθήστε Rustavi 2 Online</text>
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4A9EE8">greekiptv.tv</text>
</svg>