<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2A44"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="112" x2="800" y2="112" stroke="#1E3050" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="#1E3050" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="338" x2="800" y2="338" stroke="#1E3050" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#1E3050" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#1E3050" stroke-width="1" opacity="0.5"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#1E3050" stroke-width="1" opacity="0.5"/>
  <!-- TV Frame -->
  <rect x="180" y="60" width="440" height="290" rx="12" ry="12" fill="#1E2838" stroke="#2A4060" stroke-width="2"/>
  <!-- TV Screen -->
  <rect x="196" y="76" width="408" height="258" rx="6" ry="6" fill="url(#screen)"/>
  <!-- TV Stand -->
  <rect x="370" y="350" width="60" height="20" rx="4" ry="4" fill="#1E2838"/>
  <rect x="330" y="368" width="140" height="12" rx="6" ry="6" fill="#1E2838" stroke="#2A4060" stroke-width="1"/>
  <!-- TV Bezel indicator -->
  <circle cx="400" cy="344" r="4" fill="#4A9EE8" opacity="0.6"/>
  <!-- Screen content: IPTV channels grid -->
  <rect x="204" y="84" width="110" height="70" rx="4" fill="#0F1319" opacity="0.8"/>
  <rect x="322" y="84" width="110" height="70" rx="4" fill="#0F1319" opacity="0.8"/>
  <rect x="440" y="84" width="110" height="70" rx="4" fill="#0F1319" opacity="0.8"/>
  <rect x="558" y="84" width="38" height="70" rx="4" fill="#0F1319" opacity="0.3"/>
  <!-- Channel thumbnails -->
  <rect x="208" y="88" width="102" height="62" rx="3" fill="#1A2130"/>
  <text x="259" y="122" font-family="Arial,sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle" font-weight="bold">ANT1 HD</text>
  <text x="259" y="137" font-family="Arial,sans-serif" font-size="9" fill="#8AAEC8" text-anchor="middle">LIVE</text>
  <rect x="326" y="88" width="102" height="62" rx="3" fill="#1A2130"/>
  <text x="377" y="122" font-family="Arial,sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle" font-weight="bold">MEGA HD</text>
  <text x="377" y="137" font-family="Arial,sans-serif" font-size="9" fill="#3DCC8E" text-anchor="middle">LIVE</text>
  <rect x="444" y="88" width="102" height="62" rx="3" fill="#1A2130"/>
  <text x="495" y="122" font-family="Arial,sans-serif" font-size="11" fill="#8B5CF6" text-anchor="middle" font-weight="bold">STAR HD</text>
  <text x="495" y="137" font-family="Arial,sans-serif" font-size="9" fill="#8AAEC8" text-anchor="middle">LIVE</text>
  <!-- Second row -->
  <rect x="204" y="162" width="110" height="70" rx="4" fill="#0F1319" opacity="0.8"/>
  <rect x="322" y="162" width="110" height="70" rx="4" fill="#0F1319" opacity="0.8"/>
  <rect x="440" y="162" width="110" height="70" rx="4" fill="#0F1319" opacity="0.8"/>
  <rect x="208" y="166" width="102" height="62" rx="3" fill="#1A2130"/>
  <text x="259" y="200" font-family="Arial,sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle" font-weight="bold">ERT HD</text>
  <text x="259" y="215" font-family="Arial,sans-serif" font-size="9" fill="#3DCC8E" text-anchor="middle">LIVE</text>
  <rect x="326" y="166" width="102" height="62" rx="3" fill="#1A2130"/>
  <text x="377" y="200" font-family="Arial,sans-serif" font-size="11" fill="#8B5CF6" text-anchor="middle" font-weight="bold">ALPHA HD</text>
  <text x="377" y="215" font-family="Arial,sans-serif" font-size="9" fill="#8AAEC8" text-anchor="middle">LIVE</text>
  <rect x="444" y="166" width="102" height="62" rx="3" fill="#1A2130"/>
  <text x="495" y="200" font-family="Arial,sans-serif" font-size="11" fill="#4A9EE8" text-anchor="middle" font-weight="bold">OPEN TV</text>
  <text x="495" y="215" font-family="Arial,sans-serif" font-size="9" fill="#3DCC8E" text-anchor="middle">LIVE</text>
  <!-- Bottom bar on screen -->
  <rect x="204" y="248" width="392" height="28" rx="3" fill="#0D2A44" opacity="0.9"/>
  <circle cx="222" cy="262" r="7" fill="url(#sky)"/>
  <text x="240" y="267" font-family="Arial,sans-serif" font-size="10" fill="#4A9EE8" font-weight="bold">greekiptv.tv</text>
  <text x="380" y="267" font-family="Arial,sans-serif" font-size="10" fill="#8AAEC8" text-anchor="middle">30,000+ κανάλια • 4K • 99.9% uptime</text>
  <!-- WiFi signal -->
  <text x="680" y="40" font-family="Arial,sans-serif" font-size="12" fill="#4A9EE8">WiFi</text>
  <path d="M700 50 Q710 42 720 50" stroke="#4A9EE8" stroke-width="2" fill="none"/>
  <path d="M695 55 Q710 44 725 55" stroke="#4A9EE8" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="712" cy="60" r="2.5" fill="#4A9EE8"/>
  <!-- Title text -->
  <text x="400" y="415" font-family="Arial,sans-serif" font-size="18" fill="#E4EEF8" text-anchor="middle" font-weight="bold">Το Καλύτερο IPTV για Smart TV</text>
  <text x="400" y="438" font-family="Arial,sans-serif" font-size="13" fill="#4A9EE8" text-anchor="middle">greekiptv.tv — 30,000+ Κανάλια Χωρίς Διακοπές</text>
  <!-- Decorative dots -->
  <circle cx="50" cy="50" r="3" fill="#4A9EE8" opacity="0.4"/>
  <circle cx="70" cy="50" r="2" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="750" cy="400" r="3" fill="#4A9EE8" opacity="0.4"/>
  <circle cx="730" cy="400" r="2" fill="#8B5CF6" opacity="0.4"/>
</svg>
