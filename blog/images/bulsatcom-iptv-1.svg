<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EE8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4A9EE8;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Stars background -->
  <circle cx="50" cy="40" r="1.5" fill="#4A9EE8" opacity="0.4"/>
  <circle cx="150" cy="80" r="1" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="700" cy="60" r="1.5" fill="#4A9EE8" opacity="0.4"/>
  <circle cx="750" cy="120" r="1" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="30" cy="300" r="1" fill="#4A9EE8" opacity="0.3"/>
  <circle cx="780" cy="350" r="1.5" fill="#8B5CF6" opacity="0.4"/>
  <!-- Satellite dish -->
  <ellipse cx="180" cy="280" rx="90" ry="45" fill="none" stroke="#4A9EE8" stroke-width="3" opacity="0.8"/>
  <ellipse cx="180" cy="280" rx="70" ry="35" fill="none" stroke="#4A9EE8" stroke-width="1.5" opacity="0.4"/>
  <line x1="180" y1="280" x2="180" y2="360" stroke="#8AAEC8" stroke-width="4"/>
  <line x1="140" y1="360" x2="220" y2="360" stroke="#8AAEC8" stroke-width="3"/>
  <circle cx="180" cy="280" r="8" fill="url(#blue)"/>
  <!-- Signal waves -->
  <path d="M 230 230 Q 300 200 370 210" fill="none" stroke="#4A9EE8" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M 235 250 Q 310 220 380 230" fill="none" stroke="#4A9EE8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <path d="M 240 270 Q 315 245 385 255" fill="none" stroke="#4A9EE8" stroke-width="1" stroke-dasharray="3,4" opacity="0.3"/>
  <!-- TV screen -->
  <rect x="380" y="150" width="280" height="175" rx="12" fill="#141920" stroke="#1E3050" stroke-width="2"/>
  <rect x="392" y="162" width="256" height="151" rx="6" fill="#0D1520"/>
  <!-- IPTV logo on screen -->
  <text x="520" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#blue)">IPTV</text>
  <text x="520" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8AAEC8">BULSATCOM</text>
  <!-- Play button -->
  <circle cx="520" cy="240" r="0" fill="none"/>
  <!-- TV stand -->
  <rect x="500" y="325" width="40" height="12" rx="3" fill="#1E2838"/>
  <rect x="470" y="337" width="100" height="8" rx="4" fill="#141920"/>
  <!-- Signal dots -->
  <circle cx="380" cy="238" r="5" fill="#4A9EE8"/>
  <circle cx="355" cy="238" r="3" fill="#4A9EE8" opacity="0.6"/>
  <circle cx="335" cy="238" r="2" fill="#4A9EE8" opacity="0.3"/>
  <!-- Title text -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#E4EEF8">Bulsatcom IPTV</text>
  <text x="400" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8AAEC8">Δορυφορική &amp; IPTV Υπηρεσία — Οδηγός 2026</text>
  <!-- Decorative line -->
  <rect x="250" y="388" width="300" height="2" rx="1" fill="url(#blue)" opacity="0.5"/>
</svg>
