<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1319"/>
      <stop offset="100%" style="stop-color:#1A2130"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EE8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Screen icon -->
  <rect x="200" y="100" width="400" height="230" rx="12" fill="#1E2838" stroke="#4A9EE8" stroke-width="2"/>
  <rect x="340" y="330" width="120" height="12" rx="4" fill="#1E2838"/>
  <rect x="300" y="342" width="200" height="8" rx="4" fill="#1E2838" stroke="#2A4060" stroke-width="1"/>
  <!-- Warning icon -->
  <polygon points="400,130 450,210 350,210" fill="none" stroke="#E8A84A" stroke-width="3"/>
  <text x="400" y="200" text-anchor="middle" font-family="Arial" font-size="36" fill="#E8A84A" font-weight="bold">!</text>
  <!-- X mark -->
  <circle cx="400" cy="270" r="25" fill="none" stroke="#E85A4A" stroke-width="3"/>
  <line x1="385" y1="255" x2="415" y2="285" stroke="#E85A4A" stroke-width="3"/>
  <line x1="415" y1="255" x2="385" y2="285" stroke="#E85A4A" stroke-width="3"/>
  <!-- Greek text -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="url(#accent)">Παράνομη IPTV — Κίνδυνοι &amp; Εναλλακτικές</text>
  <text x="400" y="415" text-anchor="middle" font-family="Arial" font-size="14" fill="#8AAEC8">greekiptv.tv</text>
</svg>